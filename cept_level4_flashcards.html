<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEPT 4級單字複習</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      :root {
        --primary: #4f46e5;
        --primary-light: #e0e7ff;
        --primary-dark: #3730a3;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .flip-card {
        perspective: 1000px;
      }
      .flip-card-inner {
        transition: transform 0.6s;
        transform-style: preserve-3d;
      }
      .flip-card.flipped .flip-card-inner {
        transform: rotateY(180deg);
      }
      .flip-card-front, .flip-card-back {
        backface-visibility: hidden;
      }
      .flip-card-back {
        transform: rotateY(180deg);
      }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-2">
                <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded-full">CEPT</span>
                <h1 class="text-lg font-bold text-slate-900">4級單字複習</h1>
            </div>
            
            <!-- Stats & Controls -->
            <div class="flex items-center space-x-3 text-xs sm:text-sm text-slate-600">
                <span id="counter" class="bg-slate-100 px-2.5 py-1 rounded-md font-medium">1 / 100</span>
                <div class="flex items-center space-x-1">
                    <button onclick="changeSpeed(0.5)" id="speed-0.5" class="px-2 py-1 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 transition">0.5x</button>
                    <button onclick="changeSpeed(1.0)" id="speed-1.0" class="px-2 py-1 rounded bg-indigo-600 text-white font-medium">1.0x</button>
                    <button onclick="changeSpeed(1.5)" id="speed-1.5" class="px-2 py-1 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 transition">1.5x</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Filter Bar -->
    <div class="max-w-4xl mx-auto px-4 pt-4 w-full">
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex flex-wrap gap-2 items-center justify-between">
            <div class="flex flex-wrap gap-1.5" id="level-filters">
                <button onclick="filterLevel('all')" id="filter-all" class="px-3 py-1 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">全部</button>
                <button onclick="filterLevel('A')" id="filter-A" class="px-3 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">A 開頭</button>
                <button onclick="filterLevel('B')" id="filter-B" class="px-3 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">B 開頭</button>
                <button onclick="filterLevel('C')" id="filter-C" class="px-3 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">C 開頭</button>
                <button onclick="filterLevel('D')" id="filter-D" class="px-3 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">D 開頭</button>
                <button onclick="filterLevel('P')" id="filter-P" class="px-3 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">P 開頭</button>
                <button onclick="filterLevel('S')" id="filter-S" class="px-3 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">S 開頭</button>
            </div>
            <div class="w-full sm:w-auto flex items-center space-x-2">
                <input type="text" id="search-input" oninput="searchWords()" placeholder="搜尋單字、中文..." class="w-full sm:w-44 px-3 py-1 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="toggleStarredFilter()" id="starred-filter-btn" class="px-2.5 py-1 text-xs rounded-lg border border-slate-200 bg-white hover:bg-amber-50 text-slate-600 transition flex items-center space-x-1">
                    <span>⭐</span> <span id="starred-count">0</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow flex flex-col justify-center">
        
        <!-- Flashcard Container -->
        <div id="flashcard" class="flip-card w-full max-w-xl mx-auto h-80 sm:h-96 cursor-pointer select-none" onclick="flipCard()">
            <div class="flip-card-inner relative w-full h-full text-center rounded-2xl shadow-md bg-white border border-slate-100">
                
                <!-- Card Front -->
                <div class="flip-card-front absolute w-full h-full p-6 flex flex-col justify-between rounded-2xl bg-white overflow-y-auto">
                    <div class="flex justify-between items-center w-full">
                        <span id="card-id" class="text-xs font-bold text-indigo-500 bg-indigo-50 px-2.5 py-1 rounded-full">A01</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="event.stopPropagation(); speakWord()" class="p-2 text-slate-400 hover:text-indigo-600 rounded-full hover:bg-slate-50 transition" title="朗讀發音">
                                🔊
                            </button>
                            <button onclick="event.stopPropagation(); toggleStar()" id="star-btn" class="text-slate-300 hover:text-amber-400 text-lg transition">
                                ⭐
                            </button>
                        </div>
                    </div>
                    
                    <div class="my-auto">
                        <h2 id="card-word" class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">able</h2>
                        <p id="card-pos" class="text-xs sm:text-sm font-medium text-indigo-600 mt-2 bg-indigo-50/60 inline-block px-3 py-1 rounded-full">(adj.) 有能力的</p>
                    </div>

                    <div class="text-xs text-slate-400 flex justify-center items-center space-x-1">
                        <span>點擊卡片翻面看例句</span>
                        <span class="animate-bounce">👆</span>
                    </div>
                </div>

                <!-- Card Back -->
                <div class="flip-card-back absolute w-full h-full p-6 flex flex-col justify-between rounded-2xl bg-slate-900 text-white text-left overflow-y-auto">
                    <div class="flex justify-between items-center w-full">
                        <span class="text-xs font-bold text-indigo-300 bg-indigo-950 px-2.5 py-1 rounded-full">例句解析</span>
                        <button onclick="event.stopPropagation(); toggleStar()" id="star-btn-back" class="text-slate-500 hover:text-amber-400 text-lg transition">
                            ⭐
                        </button>
                    </div>
                    
                    <div class="my-auto space-y-3">
                        <div>
                            <p id="card-eng" class="text-sm sm:text-base font-semibold text-indigo-200">He was not able to pay his bills.</p>
                            <p id="card-chn" class="text-xs sm:text-sm text-slate-300 mt-1">他繳不起賬單。</p>
                        </div>
                    </div>

                    <div class="text-xs text-slate-400 text-center">
                        點擊卡片返回單字
                    </div>
                </div>

            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex justify-between items-center max-w-xl mx-auto w-full mt-6">
            <button onclick="prevCard()" class="px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-50 active:scale-95 transition shadow-sm flex items-center space-x-1">
                <span>← 上一個</span>
            </button>
            <div class="flex items-center space-x-2">
                <button onclick="openOverviewModal()" class="px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-50 transition shadow-sm" title="單字列表">
                    📋 總覽
                </button>
                <button onclick="randomCard()" class="px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-50 transition shadow-sm" title="隨機抽考">
                    🎲 隨機
                </button>
            </div>
            <button onclick="nextCard()" class="px-4 py-2.5 bg-indigo-600 rounded-xl text-sm font-semibold text-white hover:bg-indigo-700 active:scale-95 transition shadow-sm shadow-indigo-200 flex items-center space-x-1">
                <span>下一個 →</span>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        CEPT 4級單字複習小工具
    </footer>

    <!-- Overview Modal -->
    <div id="overview-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-xl overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-900">單字總覽列表</h3>
                <button onclick="closeOverviewModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold px-2">✕</button>
            </div>
            <div class="p-4 overflow-y-auto divide-y divide-slate-100 flex-grow" id="word-list-container">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->

            { id: "S52", word: "shoe", pos: "(n.)", definition: "鞋子", chn: "I tried on a pair of shoes, but they didn't fit.", eng: "我試穿了一雙鞋，但不合腳。" },
            { id: "S63", word: "sick", pos: "(adj.)", definition: "生病的", chn: "She was absent because she was sick.", eng: "她缺席是因為生病了。" },
            { id: "S71", word: "sing", pos: "(v.)", definition: "唱歌", chn: "She sang her baby to sleep.", eng: "她唱歌哄寶寶入睡。" }
        ];

        let currentIndex = 0;
        let currentFilteredList = [...wordsData];
        let currentSpeed = 1.0;
        let activeFilter = 'all';
        let isStarredOnly = false;
        let starredIds = JSON.parse(localStorage.getItem('cept4_starred') || '[]');

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            updateCard();
            updateStarredUI();
        });

        function updateCard() {
            if (currentFilteredList.length === 0) {
                document.getElementById('card-id').innerText = "--";
                document.getElementById('card-word').innerText = "沒有符合的單字";
                document.getElementById('card-pos').innerText = "";
                document.getElementById('card-eng').innerText = "請嘗試切換其他篩選條件或搜尋關鍵字";
                document.getElementById('card-chn').innerText = "";
                document.getElementById('counter').innerText = "0 / 0";
                return;
            }

            if (currentIndex >= currentFilteredList.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = currentFilteredList.length - 1;

            const item = currentFilteredList[currentIndex];
            
            // Reset flip state
            document.getElementById('flashcard').classList.remove('flipped');

            // Populate data
            document.getElementById('card-id').innerText = item.id;
            document.getElementById('card-word').innerText = item.word;
            document.getElementById('card-pos').innerText = item.pos + " " + item.definition;
            document.getElementById('card-eng').innerText = item.eng;
            document.getElementById('card-chn').innerText = item.chn;
            document.getElementById('counter').innerText = `${currentIndex + 1} / ${currentFilteredList.length}`;

            updateStarState(item.id);
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            if (currentFilteredList.length === 0) return;
            currentIndex = (currentIndex + 1) % currentFilteredList.length;
            updateCard();
        }

        function prevCard() {
            if (currentFilteredList.length === 0) return;
            currentIndex = (currentIndex - 1 + currentFilteredList.length) % currentFilteredList.length;
            updateCard();
        }

        function randomCard() {
            if (currentFilteredList.length === 0) return;
            currentIndex = Math.floor(Math.random() * currentFilteredList.length);
            updateCard();
        }

        function filterLevel(level) {
            activeFilter = level;
            isStarredOnly = false;
            document.getElementById('starred-filter-btn').classList.remove('bg-amber-100', 'border-amber-300');

            // Update button styles
            ['all', 'A', 'B', 'C', 'D', 'P', 'S'].forEach(l => {
                const btn = document.getElementById(`filter-${l}`);
                if (l === level) {
                    btn.className = "px-3 py-1 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition";
                } else {
                    btn.className = "px-3 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                }
            });

            applyFilters();
        }

        function toggleStarredFilter() {
            isStarredOnly = !isStarredOnly;
            const btn = document.getElementById('starred-filter-btn');
            if (isStarredOnly) {
                btn.className = "px-2.5 py-1 text-xs rounded-lg border border-amber-300 bg-amber-50 text-amber-700 transition flex items-center space-x-1 font-semibold";
            } else {
                btn.className = "px-2.5 py-1 text-xs rounded-lg border border-slate-200 bg-white hover:bg-amber-50 text-slate-600 transition flex items-center space-x-1";
            }
            applyFilters();
        }

        function searchWords() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase();
            
            currentFilteredList = wordsData.filter(item => {
                const matchesLetter = activeFilter === 'all' || item.word.toUpperCase().startsWith(activeFilter);
                const matchesStar = !isStarredOnly || starredIds.includes(item.id);
                const matchesQuery = item.word.toLowerCase().includes(query) || item.definition.includes(query) || item.chn.includes(query);
                return matchesLetter && matchesStar && matchesQuery;
            });

            currentIndex = 0;
            updateCard();
        }

        function toggleStar() {
            if (currentFilteredList.length === 0) return;
            const currentItem = currentFilteredList[currentIndex];
            const idx = starredIds.indexOf(currentItem.id);
            if (idx > -1) {
                starredIds.splice(idx, 1);
            } else {
                starredIds.push(currentItem.id);
            }
            localStorage.setItem('cept4_starred', JSON.stringify(starredIds));
            updateStarState(currentItem.id);
            updateStarredUI();
        }

        function updateStarState(id) {
            const isStarred = starredIds.includes(id);
            const starClass = isStarred ? "text-amber-400 text-lg transition" : "text-slate-300 hover:text-amber-400 text-lg transition";
            document.getElementById('star-btn').className = starClass;
            document.getElementById('star-btn-back').className = isStarred ? "text-amber-400 text-lg transition" : "text-slate-500 hover:text-amber-400 text-lg transition";
        }

        function updateStarredUI() {
            document.getElementById('starred-count').innerText = starredIds.length;
        }

        function changeSpeed(speed) {
            currentSpeed = speed;
            [0.5, 1.0, 1.5].forEach(s => {
                const btn = document.getElementById(`speed-${s}`);
                if (s === speed) {
                    btn.className = "px-2 py-1 rounded bg-indigo-600 text-white font-medium";
                } else {
                    btn.className = "px-2 py-1 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 transition";
                }
            });
        }

        function speakWord() {
            if (currentFilteredList.length === 0) return;
            const item = currentFilteredList[currentIndex];
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(item.word);
                utterance.lang = 'en-US';
                utterance.rate = currentSpeed;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("您的瀏覽器不支援語音朗讀功能");
            }
        }

        function openOverviewModal() {
            const container = document.getElementById('word-list-container');
            container.innerHTML = '';
            wordsData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "py-2.5 flex justify-between items-center text-sm hover:bg-slate-50 px-2 rounded cursor-pointer";
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-xs font-bold text-slate-400 w-10">${item.id}</span>
                        <span class="font-bold text-slate-800">${item.word}</span>
                        <span class="text-xs text-slate-500">${item.pos} ${item.definition}</span>
                    </div>
                    <span class="text-xs text-slate-600">${item.chn}</span>
                `;
                div.onclick = () => {
                    // Find in filtered list or switch
                    const idx = currentFilteredList.findIndex(w => w.id === item.id);
                    if (idx > -1) {
                        currentIndex = idx;
                    } else {
                        currentFilteredList = [item];
                        currentIndex = 0;
                    }
                    updateCard();
                    closeOverviewModal();
                };
                container.appendChild(div);
            });
            document.getElementById('overview-modal').classList.remove('hidden');
        }

        function closeOverviewModal() {
            document.getElementById('overview-modal').classList.add('hidden');
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });
    </script>
